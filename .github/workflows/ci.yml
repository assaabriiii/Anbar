name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e ".[dev,models]"
      - name: Unit tests
        run: python -m pytest -m "not network and not docker" -q
      - name: Integration tests (pack, serve, install offline)
        run: python -m pytest -m "network and not docker" -q -rs

  docker:
    name: Docker integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m docker -q -rs

  release-build:
    name: Offline release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python scripts/build_release.py
      - name: Install from the offline bundle without an index
        run: |
          mkdir /tmp/bundle && cd /tmp/bundle
          unzip -q "$GITHUB_WORKSPACE"/dist/anbar-*-offline.zip
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-index --find-links anbar-*-offline/wheels anbar
          /tmp/venv/bin/anbar --version
          python "$GITHUB_WORKSPACE"/dist/anbar-*.pyz --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
