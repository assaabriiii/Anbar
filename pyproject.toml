[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "anbar"
dynamic = ["version"]
description = "Offline development kit builder: pre-download every dependency a project needs and serve it locally when the internet goes away."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The Anbar contributors" }]
keywords = ["offline", "mirror", "pypi", "npm", "docker", "huggingface", "air-gapped"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving :: Mirroring",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
models = ["huggingface_hub>=0.20"]
socks = ["PySocks>=1.7"]
dev = ["pytest>=7.4", "build>=1.0"]

[project.scripts]
anbar = "anbar.cli:main"

[project.urls]
Homepage = "https://github.com/assaabriiii/Anbar"
Issues = "https://github.com/assaabriiii/Anbar/issues"

[tool.hatch.version]
path = "src/anbar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/anbar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs access to the public internet (deselect with -m 'not network')",
    "docker: needs a running Docker daemon",
]
