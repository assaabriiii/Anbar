[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demo"
version = "0.1"
dependencies = ["httpx>=0.27", "local @ file:///tmp/local"]

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
dev = ["ruff", {include-group = "test"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26"
torch = { version = "~2.2", extras = ["cuda"] }
mylib = { path = "../mylib" }
